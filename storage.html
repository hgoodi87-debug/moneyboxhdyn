<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>MoneyBox 보관함관리</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/mb.css?v=28">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js?v=28"></script>
<script src="js/mb-data.js?v=28"></script>
<script src="js/mb-sync.js?v=28"></script>
<style>
  body { font-family: 'Pretendard', -apple-system, system-ui, sans-serif; }

  /* 월별 장부 */
  .led-card { border:1px solid #E5E7EB; border-radius:.5rem; overflow:hidden; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .led-head { background:#FBE2CC; text-align:center; font-weight:700; padding:.55rem; font-size:.95rem; color:#7C4A1E; border-bottom:1px solid #E7CBB0; }
  .led-col th { background:#FFF3E2; color:#7C4A1E; font-weight:700; font-size:.7rem; padding:3px 4px; border:1px solid #ECECEC; }
  .led-table { width:100%; border-collapse:collapse; font-size:.72rem; table-layout:fixed; }
  .led-table td { border:1px solid #ECECEC; padding:0; height:21px; }
  .led-day { background:#FCEFDB; color:#8A5A22; text-align:center; font-weight:600; width:40px; }
  .led-table input { width:100%; height:21px; border:none; background:transparent; outline:none; font-size:.72rem; padding:0 5px; box-sizing:border-box; font-variant-numeric:tabular-nums; }
  .led-table input.amt { text-align:right; color:#1F2937; }
  .led-table input.cnt { text-align:center; color:#2563EB; }
  .led-table input:focus { background:#FFF8EC; box-shadow:inset 0 0 0 2px #F5A623; }
  .led-table input:disabled { background:#F7F7F7; }
  .led-foot td { background:#F3F4F6; font-weight:700; padding:5px 4px; font-size:.74rem; border-top:2px solid #E5E7EB; }
  .led-foot .label { background:#E9EBEE; text-align:center; color:#374151; }
  .led-foot .sum { text-align:center; color:#B45309; font-variant-numeric:tabular-nums; }
</style>
</head>
<body class="bg-[#F5F7FA]">

<div id="mb-header"></div>

<main class="pt-[84px] min-h-screen pb-8 px-6">
  <div style="max-width:1440px;margin:0 auto">
    <div class="flex justify-between items-center mb-5">
      <div>
        <h2 class="text-xl font-bold text-[#1A1A2E]">보관함 월별 정산</h2>
        <p class="text-sm text-[#6B7280] mt-0.5">날짜별 금액과 가방 갯수를 입력하면 월별 합계가 자동 계산됩니다. (자동 저장)</p>
      </div>
      <div class="flex items-center gap-4">
        <span class="text-sm text-[#6B7280]">연 합계 <b id="year-total" class="text-[#F5A623] text-base ml-1">0원</b></span>
        <div class="flex items-center gap-2">
          <button onclick="moveYear(-1)" class="px-3 py-2 rounded bg-gray-100">◀</button>
          <span id="year-label" class="font-bold text-lg" style="min-width:70px;text-align:center;display:inline-block">2026</span>
          <button onclick="moveYear(1)" class="px-3 py-2 rounded bg-gray-100">▶</button>
        </div>
      </div>
    </div>

    <div id="ledger-grid" class="grid gap-4" style="grid-template-columns:repeat(4,minmax(0,1fr))"></div>
  </div>
</main>

<script>
mbBoot('storage.html');

const LEDGER_KEY = 'mb_storage_monthly';
let currentYear = new Date().getFullYear();

function getLedger() { return mbGetOrDefault(LEDGER_KEY, {}); }
function saveLedger(o) { mbSet(LEDGER_KEY, o); }
function ym(m) { return `${currentYear}-${String(m).padStart(2,'0')}`; }
function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }

function moveYear(d) { currentYear += d; renderLedger(); }

function cellGet(k, day, field) {
  const o = getLedger();
  const v = o[k]?.[day]?.[field];
  return (v === 0 || v) ? v : '';
}
function onCell(k, day, field, val) {
  const o = getLedger();
  if (!o[k]) o[k] = {};
  if (!o[k][day]) o[k][day] = { amount:'', bags:'' };
  const clean = String(val).replace(/,/g, '').trim();
  o[k][day][field] = clean === '' ? '' : (Number(clean) || 0);
  saveLedger(o);
  updateMonthTotal(k);
  updateYearTotal();
}
function monthTotal(k) {
  const m = getLedger()[k] || {};
  return Object.values(m).reduce((s, d) => s + (Number(d.amount) || 0), 0);
}
function updateMonthTotal(k) {
  const el = document.getElementById('tot-' + k);
  if (el) el.textContent = fmtNum(monthTotal(k));
}
function updateYearTotal() {
  let t = 0;
  for (let m = 1; m <= 12; m++) t += monthTotal(ym(m));
  document.getElementById('year-total').textContent = fmtNum(t) + '원';
}

function renderLedger() {
  document.getElementById('year-label').textContent = currentYear;
  const yy = String(currentYear).slice(2);
  let html = '';
  for (let m = 1; m <= 12; m++) {
    const k = ym(m);
    const dim = daysInMonth(currentYear, m);
    let rows = '';
    for (let d = 1; d <= 31; d++) {
      const off = d > dim;
      const amt = off ? '' : cellGet(k, d, 'amount');
      const cnt = off ? '' : cellGet(k, d, 'bags');
      rows += `<tr>
        <td class="led-day">${d}일</td>
        <td><input class="amt" type="text" inputmode="numeric" value="${amt}" ${off?'disabled':''} onchange="onCell('${k}',${d},'amount',this.value)"></td>
        <td><input class="cnt" type="text" inputmode="numeric" value="${cnt}" ${off?'disabled':''} onchange="onCell('${k}',${d},'bags',this.value)"></td>
      </tr>`;
    }
    html += `<div class="led-card">
      <div class="led-head">${yy}-${m}월</div>
      <table class="led-table">
        <colgroup><col style="width:44px"><col><col style="width:66px"></colgroup>
        <thead><tr class="led-col"><th>일</th><th>금액</th><th>건</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr class="led-foot">
          <td class="label">합계</td>
          <td class="sum" id="tot-${k}">0</td>
          <td></td>
        </tr></tfoot>
      </table>
    </div>`;
  }
  document.getElementById('ledger-grid').innerHTML = html;
  for (let m = 1; m <= 12; m++) updateMonthTotal(ym(m));
  updateYearTotal();
}

renderLedger();
mbOnDataChange(renderLedger);
</script>
</body>
</html>
