<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png?v=43">
<link rel="apple-touch-icon" href="favicon.png?v=43">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>MoneyBox 로그인</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/mb.css?v=43">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js?v=43"></script>
<script src="js/mb-data.js?v=43"></script>
<script src="js/mb-sync.js?v=43"></script>
<style>
  body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  .input-login {
    width: 100%;
    border: 1.5px solid #E5E7EB;
    border-radius: .75rem;
    padding: .875rem 1rem;
    font-size: 1rem;
    outline: none;
    transition: border-color .15s;
    background: #FAFAFA;
  }
  .input-login:focus { border-color: #F5A623; background: #fff; }
  .btn-login {
    width: 100%;
    background: #F5A623;
    color: #fff;
    padding: .9rem;
    border-radius: .75rem;
    font-size: 1rem;
    font-weight: 700;
    transition: background .15s;
  }
  .btn-login:hover { background: #E0951F; }
  .btn-login:active { background: #C8841B; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .fade-up { animation: fadeUp .4s ease; }
</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#1E2A3A] via-[#243347] to-[#1A2234] flex items-center justify-center p-4">

  <div class="fade-up w-full max-w-[400px]">
    <!-- 로고 -->
    <div class="text-center mb-8">
      <div class="text-5xl mb-3">💰</div>
      <h1 class="text-white text-2xl font-bold">MoneyBox</h1>
      <p class="text-[#6B7280] text-sm mt-1">내부 운영 시스템</p>
    </div>

    <!-- 로그인 카드 -->
    <div class="bg-white rounded-2xl p-8 shadow-2xl">
      <h2 class="text-[#1A1A2E] text-xl font-bold mb-1">로그인</h2>
      <p class="text-[#6B7280] text-sm mb-6">이름과 비밀번호를 입력해주세요</p>

      <div id="already-banner" style="display:none;margin-bottom:1.25rem;padding:.85rem 1rem;background:#FFF8EC;border:1px solid #F5A623;border-radius:.7rem"></div>

      <!-- 직원 빠른 선택 -->
      <div id="quick-select" class="mb-5">
        <p class="text-xs text-[#9CA3AF] mb-2 font-medium">빠른 선택</p>
        <div id="quick-btns" class="grid grid-cols-2 gap-2"></div>
      </div>

      <form onsubmit="doLogin(event)" class="space-y-4">
        <div>
          <label class="text-xs font-semibold text-[#6B7280] mb-1.5 block">이름</label>
          <input type="text" id="login-name" placeholder="본인 이름 입력" class="input-login" autocomplete="name" required>
        </div>
        <div>
          <label class="text-xs font-semibold text-[#6B7280] mb-1.5 block">비밀번호</label>
          <div class="relative">
            <input type="password" id="login-pw" placeholder="비밀번호 입력 (초기: 0000)" class="input-login pr-12" required>
            <button type="button" onclick="togglePwVis()" class="absolute right-3 top-1/2 -translate-y-1/2 text-[#9CA3AF] hover:text-[#6B7280] text-lg">
              <span id="pw-eye">👁</span>
            </button>
          </div>
        </div>

        <p id="login-err" class="text-sm text-[#EF4444] text-center font-medium hidden"></p>

        <button type="submit" class="btn-login mt-2">로그인</button>
      </form>

      <div class="mt-4 pt-4 border-t border-gray-100 text-center">
        <button type="button" id="pwc-toggle" onclick="togglePwChange()" class="text-sm text-[#6B7280] hover:text-[#F5A623] font-medium">비밀번호 변경</button>
      </div>
      <div id="pwc-box" class="hidden mt-3 space-y-3">
        <input type="text" id="pwc-name" placeholder="이름" autocomplete="off" class="input-login">
        <input type="password" id="pwc-cur" placeholder="현재 비밀번호" class="input-login">
        <input type="password" id="pwc-new" placeholder="새 비밀번호 (4자리 이상)" class="input-login">
        <p id="pwc-msg" class="text-sm text-center font-medium hidden"></p>
        <button type="button" onclick="doChangePw()" class="btn-login">비밀번호 변경하기</button>
      </div>
    </div>

    <!-- 푸터 -->
    <p class="text-center text-[#4B5563] text-xs mt-5">
      비밀번호를 잊으셨나요? 관리자(김동교)에게 문의하세요.
    </p>
  </div>

<script>
// 이미 로그인돼 있어도 자동으로 넘어가지 않고 로그인 화면을 보여줌
// (이 링크를 공유하면 누구나 처음에 로그인창을 보게 됨)
(function() {
  mbInit();
  const u = getCurrentUser();
  if (u) {
    const b = document.getElementById('already-banner');
    if (b) {
      b.style.display = 'block';
      b.innerHTML = `
        <div style="font-size:.88rem;color:#92400E;margin-bottom:.6rem"><b>${u.name}</b>님으로 로그인되어 있어요.</div>
        <div style="display:flex;gap:.5rem">
          <button onclick="location.href='index.html'" style="flex:1;background:#F5A623;color:#fff;border:none;border-radius:.5rem;padding:.6rem;font-weight:700;cursor:pointer">계속하기 →</button>
          <button onclick="switchAccount()" style="background:#fff;border:1px solid #E5E7EB;border-radius:.5rem;padding:.6rem .8rem;font-weight:600;cursor:pointer">다른 계정</button>
        </div>`;
    }
  }
})();
function switchAccount() {
  try { localStorage.removeItem(MB.SESSION_KEY); } catch (e) {}
  const b = document.getElementById('already-banner');
  if (b) b.style.display = 'none';
  const n = document.getElementById('login-name');
  if (n) { n.value = ''; n.focus(); }
}

// 빠른 선택 버튼
(function() {
  const employees = mbGetOrDefault(MB.EMPLOYEES_KEY, MB.DEFAULT_EMPLOYEES);
  const container = document.getElementById('quick-btns');
  container.innerHTML = employees.map(e => `
    <button type="button" onclick="quickSelect('${e.name}')"
      class="px-3 py-2 rounded-lg border border-gray-200 text-sm text-left hover:border-[#F5A623] hover:bg-[#FFF8EC] transition">
      <span class="font-medium text-[#1A1A2E]">${e.name}</span>
      <span class="text-xs text-[#9CA3AF] ml-1">${e.branch || ''}</span>
    </button>
  `).join('');
})();

function quickSelect(name) {
  document.getElementById('login-name').value = name;
  document.getElementById('login-pw').focus();
}

function togglePwVis() {
  const inp = document.getElementById('login-pw');
  const eye = document.getElementById('pw-eye');
  if (inp.type === 'password') { inp.type = 'text'; eye.textContent = '🙈'; }
  else { inp.type = 'password'; eye.textContent = '👁'; }
}

function doLogin(e) {
  e.preventDefault();
  const name = document.getElementById('login-name').value.trim();
  const pw   = document.getElementById('login-pw').value;
  const errEl = document.getElementById('login-err');

  const result = mbLogin(name, pw);
  if (!result.ok) {
    errEl.textContent = result.msg;
    errEl.classList.remove('hidden');
    document.getElementById('login-pw').select();
    return;
  }
  errEl.classList.add('hidden');
  window.location.href = 'index.html';
}

// ─── 본인 비밀번호 변경 ───
function togglePwChange() {
  const box = document.getElementById('pwc-box');
  box.classList.toggle('hidden');
  document.getElementById('pwc-toggle').textContent =
    box.classList.contains('hidden') ? '비밀번호 변경' : '비밀번호 변경 닫기';
}
function doChangePw() {
  const name = document.getElementById('pwc-name').value.trim();
  const cur  = document.getElementById('pwc-cur').value;
  const nw   = document.getElementById('pwc-new').value;
  const msg  = document.getElementById('pwc-msg');
  const show = (t, ok) => { msg.textContent = t; msg.classList.remove('hidden'); msg.style.color = ok ? '#10B981' : '#EF4444'; };
  const list = mbGetOrDefault(MB.EMPLOYEES_KEY, MB.DEFAULT_EMPLOYEES);
  const e = list.find(x => x.name === name);
  if (!e) { show('이름을 찾을 수 없습니다.', false); return; }
  if ((e.password || '0000') !== cur) { show('현재 비밀번호가 맞지 않습니다.', false); return; }
  if (nw.length < 4) { show('새 비밀번호는 4자리 이상이어야 합니다.', false); return; }
  e.password = nw;
  mbSet(MB.EMPLOYEES_KEY, list);
  show('변경되었습니다. 새 비밀번호로 로그인하세요.', true);
  document.getElementById('pwc-cur').value = '';
  document.getElementById('pwc-new').value = '';
}

// Enter 키 자연 처리 (form submit)
document.getElementById('login-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('login-pw').focus();
});
</script>
</body>
</html>
