<main class="pt-[92px] min-h-screen pb-6 px-20">

        <div class="grid grid-cols-6 gap-2 mb-2 text-xs">
          <div><label class="text-[#6B7280]">5만원 장</label><input type="number" id="st-50k" value="0" class="input-base w-full"></div>
          <div><label class="text-[#6B7280]">1만원 장</label><input type="number" id="st-10k" value="0" class="input-base w-full"></div>
          <div><label class="text-[#6B7280]">5천원 장</label><input type="number" id="st-5k" value="0" class="input-base w-full"></div>
          <div><label class="text-[#6B7280]">1천원 장</label><input type="number" id="st-1k" value="0" class="input-base w-full"></div>
          <div><label class="text-[#6B7280]">500원 개</label><input type="number" id="st-500" value="0" class="input-base w-full"></div>
          <div><label class="text-[#6B7280]">100원 개</label><input type="number" id="st-100" value="0" class="input-base w-full"></div>

          <div class="text-right"><label class="text-xs text-[#6B7280] block">총 정산 금액 (자동)</label><div id="st-total" class="text-xl font-bold text-[#F5A623]">0원</div></div>

        <thead class="bg-[#F5F7FA] text-[#6B7280]">

            <th class="py-2 px-2 text-left">날짜/시간</th>
            <th class="py-2 px-2 text-center">5만</th>
            <th class="py-2 px-2 text-center">1만</th>
            <th class="py-2 px-2 text-center">5천</th>
            <th class="py-2 px-2 text-center">1천</th>
            <th class="py-2 px-2 text-center">500</th>
            <th class="py-2 px-2 text-center">100</th>

        </div>

      <table class="w-full text-sm">

            <th class="py-2 px-2 text-left">날짜</th>
            <th class="py-2 px-2 text-left">이름</th>

      <!-- 메모 목록 -->

        <h4 class="font-bold text-sm text-[#6B7280] mb-2">📝 메모 (예외 상황 기록)</h4>

<!-- 특이사항 모달 -->

    <h3 class="text-lg font-bold mb-4">특이사항 추가</h3>
    <div class="grid grid-cols-2 gap-3">
      <div><label class="text-xs text-[#6B7280]">날짜</label><input type="date" id="is-date" class="input-base w-full"></div>
      <div><label class="text-xs text-[#6B7280]">이름</label><input type="text" id="is-name" class="input-base w-full"></div>
      <div><label class="text-xs text-[#6B7280]">통화</label><select id="is-cur" class="input-base w-full"></select></div>
      <div><label class="text-xs text-[#6B7280]">거래금액 (외화)</label><input type="number" id="is-amt" oninput="recalcIssue()" class="input-base w-full"></div>
      <div><label class="text-xs text-[#6B7280]">환율</label><input type="number" id="is-rate" step="0.01" oninput="recalcIssue()" class="input-base w-full"></div>
      <div><label class="text-xs text-[#6B7280]">총 금액 (자동)</label><div id="is-total" class="input-base w-full font-bold text-[#1E2A3A]" style="background:#F9FAFB;display:flex;align-items:center">0원</div></div>
      <div><label class="text-xs text-[#6B7280]">실수령액</label><input type="number" id="is-paid" oninput="recalcIssue()" class="input-base w-full"></div>
      <div><label class="text-xs text-[#6B7280]">수령여부 (자동)</label>
        <select id="is-status" class="input-base w-full">
          <option>수령완료</option><option>부분수령</option><option>미수령</option>
        </select>
      </div>
      <div><label class="text-xs text-[#6B7280]">미수금액 (자동)</label><input type="number" id="is-unpaid" value="0" readonly class="input-base w-full font-bold text-[#EF4444]" style="background:#F9FAFB"></div>
    </div>

      <button onclick="closeIssueModal()" class="flex-1 py-2 rounded bg-gray-100">취소</button>

<!-- 메모 모달 -->
<div id="memo-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center">
  <div class="bg-white rounded-2xl p-6 w-[480px]">
    <h3 class="text-lg font-bold mb-1">메모 추가</h3>
    <p class="text-xs text-[#6B7280] mb-3">돈이 이유 없이 안 맞거나, 무인기에 돈이 걸리는 등 예외 상황을 자유롭게 적어주세요.</p>
    <textarea id="memo-text" rows="5" placeholder="예) 마감 시 5만원권 1장 부족 — 원인 불명 / 무인기 입금구에 1만원권 걸림" class="input-base w-full" style="resize:vertical"></textarea>
    <div class="flex gap-2 mt-5">
      <button onclick="closeMemoModal()" class="flex-1 py-2 rounded bg-gray-100">취소</button>
      <button onclick="saveMemo()" class="flex-1 btn-primary">저장</button>
    </div>
  </div>
</div>

<script>
mbBoot('atm.html');

document.getElementById('is-cur').innerHTML = MB.CURRENCIES.map(c=>`<option>${c}</option>`).join('');

// ─── 시재 보충 ───────────────────────────────────────
// 500원 동전: 2.5만원 묶음(c500a) / 2.0만원 묶음(c500b) 두 종류
function calcRefill(b50,b10,b5,b1,c500a,c500b,c100) {
  return b50*5000000 + b10*1000000 + b5*500000 + b1*100000 + c500a*25000 + c500b*20000 + c100*5000;
}
function readRefillForm() {
  const v = id => Number(document.getElementById(id).value || 0);
  return {
    bills_50k: v('rf-50k'), bills_10k: v('rf-10k'), bills_5k: v('rf-5k'),
    bills_1k: v('rf-1k'), coins_500: v('rf-500'), coins_500_20k: v('rf-500b'), coins_100: v('rf-100'),
  };
}
['rf-50k','rf-10k','rf-5k','rf-1k','rf-500','rf-500b','rf-100'].forEach(id => {
  document.getElementById(id).addEventListener('input', updateRefillTotal);
});
function updateRefillTotal() {
  const r = readRefillForm();
  const total = calcRefill(r.bills_50k,r.bills_10k,r.bills_5k,r.bills_1k,r.coins_500,r.coins_500_20k,r.coins_100);
  document.getElementById('rf-total').textContent = fmtNum(total) + '원';
}
function saveRefill() {
  const r = readRefillForm();
  const total = calcRefill(r.bills_50k,r.bills_10k,r.bills_5k,r.bills_1k,r.coins_500,r.coins_500_20k,r.coins_100);
  if (!total) { alert('금액 0원입니다.'); return; }
  const t = today();
  mbPush(MB.ATM_REFILL_KEY, {
    id: uid(), date: t, dayOfWeek: dayOfWeek(t), time: nowTime(),
    ...r, totalAmount: total,
    assignee: getCurrentUser().name,
    note: document.getElementById('rf-note').value,
  });
  ['rf-50k','rf-10k','rf-5k','rf-1k','rf-500','rf-500b','rf-100'].forEach(id => document.getElementById(id).value = 0);
  document.getElementById('rf-note').value = '';
  updateRefillTotal();
  renderRefills();
}
function deleteRefill(id) {
  if (!confirm('삭제?')) return;
  const item = mbGetOrDefault(MB.ATM_REFILL_KEY, []).find(x => x.id === id);
  mbLogDelete('무인기 시재보충', MB.ATM_REFILL_KEY, item, r => `${r.date} ${fmtNum(r.totalAmount)}원 (${r.assignee||''})`);
  mbRemove(MB.ATM_REFILL_KEY, x => x.id === id);
  renderRefills();
}
let _refillPage = 0;
const REFILL_PER_PAGE = 10;
function refillPage(d) { _refillPage += d; renderRefills(); }
function renderRefills() {
  const list = mbGetOrDefault(MB.ATM_REFILL_KEY, []).sort((a,b) => (b.date+b.time).localeCompare(a.date+a.time));
  const pages = Math.max(1, Math.ceil(list.length / REFILL_PER_PAGE));
  if (_refillPage > pages - 1) _refillPage = pages - 1;
  if (_refillPage < 0) _refillPage = 0;
  const start = _refillPage * REFILL_PER_PAGE;
  const pageItems = list.slice(start, start + REFILL_PER_PAGE);
  document.getElementById('refill-list').innerHTML = list.length === 0
    ? '<tr><td colspan="11" class="text-center py-6 text-[#9CA3AF]">기록 없음</td></tr>'
    : pageItems.map(r => `
      <tr class="border-b">
        <td class="py-2 px-2">${r.date} ${r.time}</td>
        <td class="text-center">${r.bills_50k}</td>
        <td class="text-center">${r.bills_10k}</td>
        <td class="text-center">${r.bills_5k}</td>
        <td class="text-center">${r.bills_1k}</td>
        <td class="text-center">${r.coins_500}</td>
        <td class="text-center">${r.coins_500_20k||0}</td>
        <td class="text-center">${r.coins_100}</td>
        <td class="text-right font-bold text-[#F5A623]">${fmtNum(r.totalAmount)}</td>
        <td class="px-2">${r.assignee}</td>
        <td class="text-right"><button onclick="deleteRefill('${r.id}')" class="text-[#EF4444] text-xs">삭제</button></td>
      </tr>`).join('');
  const pager = document.getElementById('refill-pager');
  if (pager) {
    if (list.length <= REFILL_PER_PAGE) { pager.innerHTML = ''; }
    else {
      const bs = 'border:none;background:#F3F4F6;color:#374151;border-radius:.4rem;padding:.25rem .7rem;font-size:.85rem;cursor:pointer';
      pager.innerHTML = `<button onclick="refillPage(-1)" ${_refillPage<=0?'disabled style="opacity:.35;'+bs+'"':'style="'+bs+'"'}>◀</button>`
        + `<span class="text-xs text-[#6B7280]">${_refillPage+1} / ${pages} 페이지 · 총 ${list.length}건</span>`
        + `<button onclick="refillPage(1)" ${_refillPage>=pages-1?'disabled style="opacity:.35;'+bs+'"':'style="'+bs+'"'}>▶</button>`;
    }
  }
}

// ─── 시재 정산 (기록 누적) ──────────────────────────────
function calcSettle(s50,s10,s5,s1,c500,c100) {
  return s50*50000 + s10*10000 + s5*5000 + s1*1000 + c500*500 + c100*100;
}
function readSettleForm() {
  const v = id => Number(document.getElementById(id).value || 0);
  return {
    cnt_50k: v('st-50k'), cnt_10k: v('st-10k'), cnt_5k: v('st-5k'),
    cnt_1k: v('st-1k'), cnt_500: v('st-500'), cnt_100: v('st-100'),
  };
}
['st-50k','st-10k','st-5k','st-1k','st-500','st-100'].forEach(id => {
  document.getElementById(id).addEventListener('input', updateSettleTotal);
});
function updateSettleTotal() {
  const r = readSettleForm();
  document.getElementById('st-total').textContent = fmtNum(calcSettle(r.cnt_50k,r.cnt_10k,r.cnt_5k,r.cnt_1k,r.cnt_500,r.cnt_100)) + '원';
}
function saveSettle() {
  const r = readSettleForm();
  const total = calcSettle(r.cnt_50k,r.cnt_10k,r.cnt_5k,r.cnt_1k,r.cnt_500,r.cnt_100);
  if (!total) { alert('금액 0원입니다.'); return; }
  const finalAmount = Number(String(document.getElementById('st-final').value).replace(/,/g,'')) || 0;
  const t = today();
  mbPush(MB.ATM_SETTLE_KEY, {
    id: uid(), date: t, dayOfWeek: dayOfWeek(t), time: nowTime(),
    ...r, totalAmount: total, finalAmount,
    assignee: getCurrentUser().name,
  });
  ['st-50k','st-10k','st-5k','st-1k','st-500','st-100'].forEach(id => document.getElementById(id).value = 0);
  document.getElementById('st-final').value = '';
  updateSettleTotal();
  renderSettles();
}
function deleteSettle(id) {
  if (!confirm('삭제?')) return;
  const item = mbGetOrDefault(MB.ATM_SETTLE_KEY, []).find(x => x.id === id);
  mbLogDelete('무인기 시재정산', MB.ATM_SETTLE_KEY, item, r => `${r.date} ${fmtNum(r.totalAmount)}원 (${r.assignee||''})`);
  mbRemove(MB.ATM_SETTLE_KEY, x => x.id === id);
  renderSettles();
}
let _settlePage = 0;
const SETTLE_PER_PAGE = 10;
function updateSettleFinal(id, value) {
  const list = mbGetOrDefault(MB.ATM_SETTLE_KEY, []);
  const r = list.find(x => x.id === id);
  if (!r) return;
  r.finalAmount = Number(String(value).replace(/,/g, '')) || 0;
  mbSet(MB.ATM_SETTLE_KEY, list);
}
function settlePage(d) { _settlePage += d; renderSettles(); }
function renderSettles() {
  const list = mbGetOrDefault(MB.ATM_SETTLE_KEY, [])
    .filter(r => r.date)
    .sort((a,b) => (b.date+(b.time||'')).localeCompare(a.date+(a.time||'')));
  const pages = Math.max(1, Math.ceil(list.length / SETTLE_PER_PAGE));
  if (_settlePage > pages - 1) _settlePage = pages - 1;
  if (_settlePage < 0) _settlePage = 0;
  const start = _settlePage * SETTLE_PER_PAGE;
  const pageItems = list.slice(start, start + SETTLE_PER_PAGE);
  document.getElementById('settle-list').innerHTML = list.length === 0
    ? '<tr><td colspan="11" class="text-center py-6 text-[#9CA3AF]">기록 없음</td></tr>'
    : pageItems.map(r => `
      <tr class="border-b">
        <td class="py-2 px-2">${r.date} ${r.time||''}</td>
        <td class="text-center">${r.cnt_50k}</td>
        <td class="text-center">${r.cnt_10k}</td>
        <td class="text-center">${r.cnt_5k}</td>
        <td class="text-center">${r.cnt_1k}</td>
        <td class="text-center">${r.cnt_500}</td>
        <td class="text-center">${r.cnt_100}</td>
        <td class="text-right font-bold text-[#F5A623]">${fmtNum(r.totalAmount)}</td>
        <td class="px-2">${r.assignee||''}</td>
        <td class="text-right"><input type="text" inputmode="numeric" value="${r.finalAmount!=null?fmtNum(r.finalAmount):''}" placeholder="입력"
             onchange="updateSettleFinal('${r.id}', this.value)"
             style="width:112px;text-align:right;border:1px solid #E5E7EB;border-radius:.4rem;padding:.28rem .45rem;font-size:.85rem;outline:none;font-variant-numeric:tabular-nums"></td>
        <td class="text-right"><button onclick="deleteSettle('${r.id}')" class="text-[#EF4444] text-xs">삭제</button></td>
      </tr>`).join('');
  const pager = document.getElementById('settle-pager');
  if (pager) {
    if (list.length <= SETTLE_PER_PAGE) { pager.innerHTML = ''; }
    else {
      const bs = 'border:none;background:#F3F4F6;color:#374151;border-radius:.4rem;padding:.25rem .7rem;font-size:.85rem;cursor:pointer';
      pager.innerHTML = `<button onclick="settlePage(-1)" ${_settlePage<=0?'disabled style="opacity:.35;'+bs+'"':'style="'+bs+'"'}>◀</button>`
        + `<span class="text-xs text-[#6B7280]">${_settlePage+1} / ${pages} 페이지 · 총 ${list.length}건</span>`
        + `<button onclick="settlePage(1)" ${_settlePage>=pages-1?'disabled style="opacity:.35;'+bs+'"':'style="'+bs+'"'}>▶</button>`;
    }
  }
}

// ─── 특이사항 ──────────────────────────────────────
function recalcIssue() {
  const v = id => Number(document.getElementById(id).value || 0);
  const total = v('is-amt') * v('is-rate');               // 총 금액 = 거래금액 × 환율
  const paid  = v('is-paid');
  const unpaid = Math.max(0, Math.round(total - paid));    // 미수금액 = 총 금액 − 실수령액
  document.getElementById('is-total').textContent = fmtNum(total) + '원';
  document.getElementById('is-unpaid').value = unpaid;
  // 수령여부 자동 판정
  const status = total <= 0 ? '미수령'
               : unpaid <= 0 ? '수령완료'
               : paid > 0 ? '부분수령' : '미수령';
  document.getElementById('is-status').value = status;
}
function openIssueModal() {
  document.getElementById('is-date').value = today();
  ['is-name','is-amt','is-rate','is-paid'].forEach(i => document.getElementById(i).value = '');
  document.getElementById('is-unpaid').value = 0;
  document.getElementById('is-total').textContent = '0원';
  document.getElementById('is-status').value = '미수령';
  document.getElementById('issue-modal').classList.remove('hidden');
}
function closeIssueModal() { document.getElementById('issue-modal').classList.add('hidden'); }
function saveIssue() {
  const amt  = Number(document.getElementById('is-amt').value);
  const rate = Number(document.getElementById('is-rate').value);
  mbPush(MB.ATM_ISSUES_KEY, {
    id: uid(),
    date: document.getElementById('is-date').value,
    customerName: document.getElementById('is-name').value,
    currency: document.getElementById('is-cur').value,
    tradeAmount: amt,
    rate: rate,
    totalAmount: Math.round(amt * rate),
    actualPaid: Number(document.getElementById('is-paid').value),
    receiptStatus: document.getElementById('is-status').value,
    unpaidAmount: Number(document.getElementById('is-unpaid').value),
  });
  closeIssueModal();
  renderIssues();
}
function deleteIssue(id) {
  if (!confirm('삭제?')) return;
  const item = mbGetOrDefault(MB.ATM_ISSUES_KEY, []).find(x => x.id === id);
  mbLogDelete('무인기 특이사항', MB.ATM_ISSUES_KEY, item, i => `${i.date} ${i.customerName||''} 미수 ${fmtNum(i.unpaidAmount)}원`);
  mbRemove(MB.ATM_ISSUES_KEY, x => x.id === id);
  renderIssues();
}
function renderIssues() {
  const list = mbGetOrDefault(MB.ATM_ISSUES_KEY, []).sort((a,b) => b.date.localeCompare(a.date));
  document.getElementById('issues-list').innerHTML = list.length === 0
    ? '<tr><td colspan="10" class="text-center py-6 text-[#9CA3AF]">특이사항 없음</td></tr>'
    : list.map(i => {
      const cls = i.receiptStatus === '수령완료' ? '' :
                  i.receiptStatus === '부분수령' ? 'bg-yellow-50' : 'bg-red-50';
      const total = i.totalAmount != null ? i.totalAmount : Math.round((i.tradeAmount||0)*(i.rate||0));
      return `<tr class="border-b ${cls}">
        <td class="py-2 px-2">${i.date}</td>
        <td class="px-2">${i.customerName}</td>
        <td class="text-center">${i.currency}</td>
        <td class="text-right">${fmtNum(i.tradeAmount)}</td>
        <td class="text-right">${i.rate||''}</td>
        <td class="text-right font-bold text-[#1E2A3A]">${fmtNum(total)}</td>
        <td class="text-right">${fmtNum(i.actualPaid)}</td>
        <td class="text-center"><span class="text-xs font-bold">${i.receiptStatus}</span></td>
        <td class="text-right text-[#EF4444] font-bold">${fmtNum(i.unpaidAmount)}</td>
        <td class="text-right"><button onclick="deleteIssue('${i.id}')" class="text-[#EF4444] text-xs">삭제</button></td>
      </tr>`;
    }).join('');
}

// ─── 메모 (예외 상황) ──────────────────────────────
const MEMO_KEY = 'mb_atm_memo';
function escMemo(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function openMemoModal() {
  document.getElementById('memo-text').value = '';
  document.getElementById('memo-modal').classList.remove('hidden');
  setTimeout(() => document.getElementById('memo-text').focus(), 50);
}
function closeMemoModal() { document.getElementById('memo-modal').classList.add('hidden'); }
function saveMemo() {
  const text = document.getElementById('memo-text').value.trim();
  if (!text) { alert('내용을 입력하세요.'); return; }
  mbPush(MEMO_KEY, { id: uid(), date: today(), time: nowTime(), author: getCurrentUser()?.name || '-', text });
  closeMemoModal();
  renderMemos();
}
function deleteMemo(id) {
  if (!confirm('삭제?')) return;
  const item = mbGetOrDefault(MEMO_KEY, []).find(x => x.id === id);
  mbLogDelete('무인기 메모', MEMO_KEY, item, m => `${m.date} ${(m.text||'').slice(0,30)}`);
  mbRemove(MEMO_KEY, x => x.id === id);
  renderMemos();
}
function renderMemos() {
  const list = mbGetOrDefault(MEMO_KEY, []).sort((a,b) => (b.date+(b.time||'')).localeCompare(a.date+(a.time||'')));
  document.getElementById('memo-list').innerHTML = list.length === 0
    ? '<p class="text-sm text-[#9CA3AF] py-2">메모 없음</p>'
    : list.map(m => `
      <div class="flex items-start gap-3 py-2 border-b last:border-0">
        <div class="text-xs text-[#9CA3AF] whitespace-nowrap pt-0.5" style="min-width:92px">
          ${m.date} ${m.time||''}<br><span class="text-[#6B7280] font-medium">${escMemo(m.author)}</span>
        </div>
        <div class="flex-1 text-sm" style="white-space:pre-wrap;word-break:break-word">${escMemo(m.text)}</div>
        <button onclick="deleteMemo('${m.id}')" class="text-[#EF4444] text-xs shrink-0">삭제</button>
      </div>`).join('');
}

function atmAll() {
  renderRefills();
  updateRefillTotal();
  renderSettles();
  updateSettleTotal();
  renderIssues();
  renderMemos();
}
atmAll();
mbOnDataChange(atmAll);
</script>
